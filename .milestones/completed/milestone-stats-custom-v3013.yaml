success_criteria:
  - "The repository has exactly one local branch and one worktree."
  - "The branch is based on upstream v3.0.13 and preserves the required watts-reader behavior without duplicating the upstream wake fix."
  - "The custom app cannot self-update over itself from the upstream Stats release feed."
  - "Tests and a local app build pass, followed by a real launch smoke check."
  - "A root DESIGN.md defines the Native Telemetry contract and every redesigned primitive maps to it."
  - "Dashboard prioritizes live system health and trends; static hardware inventory is subordinate."
  - "Settings navigation is keyboard and VoiceOver operable, visibly focused, resizable, and localization-safe."
  - "Module popups and menu-bar widgets use coherent shared anatomy, hierarchy, numeric alignment, and non-color-only semantics."
  - "Visible support, issue, release, and update surfaces are owned by this fork or explicitly credited upstream."
  - "Fresh visual, accessibility, build, test, and runtime evidence passes on the custom build."

