name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        # Logic tests only (formatters, source-selection matrix) — the
        # hardware smoke suite cannot run on cloud runners (no SMC/fans,
        # helper needs consent). Signing off, same as the archive step.
        run: xcodebuild -scheme Stats -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Release archive
        run: xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive CODE_SIGNING_ALLOWED=NO
